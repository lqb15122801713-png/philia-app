<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F2" />
  <title>网络走丢了 · 菲丽亚宠物</title>
  <!-- 静态离线兜底页（workbox navigateFallback）：零外部依赖、内联样式，
       视觉口径唯一来源 packages/shared/src/tokens.ts（VI v2.0：
       纸白 #FAF8F2 底 / 深棕墨 #3B2E24 字 / 淡黄 #F2DFA6 点睛） -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #FAF8F2;
      color: #3B2E24;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
        "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .paw { width: 56px; height: 56px; color: #F2DFA6; }
    .title { font-size: 20px; line-height: 28px; font-weight: 600; }
    .desc { font-size: 15px; line-height: 22px; color: #8A7D6B; }
    .retry {
      margin-top: 12px;
      border: none;
      border-radius: 9999px;
      padding: 12px 32px;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
      color: #3B2E24;
      background: #F2DFA6;
      box-shadow: 0 6px 16px rgba(46, 35, 24, 0.18);
      cursor: pointer;
    }
    .retry:active { transform: scale(0.97); }
    .brand {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      font-size: 12px;
      line-height: 16px;
      color: #B9A98F;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <!-- 深棕墨 paw 剪影（同 AppDock PawMark 形状，点睛淡黄底） -->
  <svg class="paw" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <ellipse cx="5.6" cy="7.6" rx="1.7" ry="2.2" />
    <ellipse cx="9.8" cy="5.2" rx="1.8" ry="2.3" />
    <ellipse cx="14.2" cy="5.2" rx="1.8" ry="2.3" />
    <ellipse cx="18.4" cy="7.6" rx="1.7" ry="2.2" />
    <path d="M12 10.8c-3.1 0-5.6 2.7-5.6 5.1 0 1.7 1.3 3 3 3 1 0 1.7-.5 2.6-.5s1.6.5 2.6.5c1.7 0 3-1.3 3-3 0-2.4-2.5-5.1-5.6-5.1z" />
  </svg>
  <p class="title">网络走丢了</p>
  <p class="desc">请检查网络后重试</p>
  <button class="retry" type="button" onclick="location.reload()">重试</button>
  <p class="brand">菲丽亚宠物</p>
</body>
</html>
